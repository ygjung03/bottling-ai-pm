        "홍보_일정": [{"시점": "...", "채널": "...", "내용": "..."}],
        "홍보_문구": "...",
        "해시태그": ["#..."],
        "실행_준비물": ["..."],
        "소요_기간": "3일",
        "예상_리스크": ["..."],
