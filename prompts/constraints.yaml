# 폐기 사유·실패 경험에서 추출한 하드 제약. 사례가 생길 때마다 누적한다.
#
# origin 은 이력 추적용이며, 프롬프트에는 rule 만 주입한다.
# target 은 이 규칙을 넣을 단계다 (p2 셰프 / p3 마케터).
#   비워 두면 (2)(3)(4) 모두에 들어간다.
#   (4)는 최종 검수 단계라 target 과 무관하게 전부 받는다 (chain/inputs.py).
#
# 주의: 폐기 사례 원문을 그대로 넣지 않는다.
#       LLM은 부정문 처리가 취약해 "OO 하지 마라"가 역효과를 낼 수 있다.
#       반드시 긍정형 규칙으로 변환할 것.
#
# 2026-09-08 교체. 8/31 2차 방문에서 기존 협업 3건의 경과를 들었고,
# 가상 예시 3건을 실제 사례에서 뽑은 규칙 7건으로 바꿨다 (명세서 1-5).

constraints:
  # ── 홍보 (3건 공통 실패 요인) ──
  #
  # 세 건 모두 홍보에서 아쉬웠으나 원인이 조금씩 다르다.
  #   C001 채널이 부족 — 현수막 하나뿐
  #   C002 시점이 늦음 — 실행 기간에만 알림
  #   C003 기간이 짧음 — 인지가 쌓이기 전에 끝남
  # 하나로 묶으면 "홍보를 잘 하라"가 되어 지시가 되지 않는다.
  # 셋으로 나누면 각각이 검증 가능한 형태가 된다 (자동 검증 A7～A9).
  - id: C001
    origin: "제과·디저트 협업 — 유동인구는 많았으나 현수막만으로는 유인이 부족했다 (2025)"
    rule: "홍보는 실행 최소 1주 전부터 시작하고, 현장 게시물 외에 온라인 사전 콘텐츠를 하나 이상 포함한다."
    target: p3

  - id: C002
    origin: "카페 협업 — 파는지도 모를 정도로 인지가 부족했다 (2025)"
    rule: "협업 사실을 알리는 콘텐츠를 실행 전에 배치한다. 실행 기간에만 알리는 구성은 피한다."
    target: p3

  - id: C003
    origin: "카페 협업 — 짧게 한 번으로는 효과가 없어 중단했다 (2025)"
    rule: "실행 기간은 최소 3일 이상으로 제안한다. 하루짜리 이벤트는 인지가 쌓이기 전에 끝난다."
    target: p3

  # ── 메뉴 ──
  - id: C004
    origin: "화덕 요리 협업 — 맛이 대중적이지 않았다 (2025)"
    rule: "익숙한 맛을 기본으로 하고, 새로운 요소는 한 가지만 둔다."
    target: p2

  # ── 실행 조건 ──
  #
  # C005 는 협업 형태를 좁힌 규칙이다. 실증 이후 다른 형태를 다루기로 하면
  # 이 규칙만 고치면 된다. 프롬프트 본문이 아니라 여기에 둔 이유다.
  - id: C005
    origin: "2차 방문 — 완제품 매입 형태가 가장 적합하다 (8/31)"
    rule: "협력사가 완성한 것을 받아 그대로 판매하는 구성으로 만든다. 바틀링에서 조리하거나 조합하는 단계를 두지 않는다."
    target: p2

  # C006 은 통째로 바뀌었다. 원래는 붕어빵기계 1주 예약을 피하려는 규칙이었으나,
  # 매입 형태에서는 협력사가 자기 장비로 만들므로 그 문제가 없다.
  # 대신 매입에서 새로 생기는 문제 — 완제품의 보관 조건 — 를 담았다.
  - id: C006
    origin: "제과·디저트 협업 — 반죽은 당일 소진해야 한다 (8/31)"
    rule: "완제품의 보관 방법과 유통 기한, 하루에 받을 수 있는 수량을 밝힌다. 협력사가 알려주지 않았으면 확인이 필요하다고 적는다."
    target: p2

  # 3일은 바틀링이 실행 전에 매장에서 재료를 준비하는 기간이다.
  # 미리 반죽하는 등 매장에서 미리 해 두는 작업만 포함하고,
  # 홍보물 제작·게시나 협력사의 물량 확보 기간에는 해당하지 않는다.
  #
  # 협력사의 물량 확보에 일주일이 걸리더라도 실행일까지 납품되면 된다.
  # 예를 들어 협력사가 물량 확보에 일주일이 걸린다면, 이건 바틀링의 3일
  # 준비 기간에 포함하지 않는다.
  #
  # 홍보는 3일보다 앞서 시작해야 하므로(C001·C002) 이 기간에 포함하지 않는다.
  - id: C007
    origin: "2차 방문 — 준비 기간이 길면 실행이 밀린다"
    rule: "바틀링이 실행 전에 매장에서 재료를 준비하는 기간은 3일 이내로 잡는다. 협력사가 물량을 확보하는 기간이나 홍보 준비 기간은 여기에 해당하지 않는다. 협력사의 물량 확보가 오래 걸려도 실행일까지 납품되면 된다."
    target: p2

  # ── 문체 ──
  #
  # 실패 사례가 아니라 문서화에서 나온 규칙. (2)(3)(4)의 문장이 협업 제안서에
  # 그대로 들어가는데 단계마다 말투가 달라 한 문서 안에서 "~한다"와
  # "~합니다"가 섞였다 (9/21). 홍보 문구는 SNS 에 올리는 글이라 예외다 —
  # 말투를 프롬프트로 정하지 않고 사람이 다듬는다.
  - id: C008
    origin: "1차 제안서 문서화 — 협력사와 바틀링 대표가 같은 문서를 읽는다 (9/21)"
    rule: "문장으로 쓰는 항목(이유·설명·배경·이익·리스크 등)은 협력사 사장에게 말하듯 '~합니다', '~해 주셨으면 합니다', '~할 것으로 예상됩니다' 로 끝낸다. 메뉴명·구성·명칭처럼 이름만 적는 항목과 홍보 문구는 그대로 둔다."
