# 폐기 사유에서 추출한 하드 제약. 실행할 때마다 누적한다.
# origin 은 이력 추적용이며, 프롬프트에는 rule 만 주입한다.
#
# 주의: 폐기 사례 원문을 그대로 넣지 않는다.
#       LLM은 부정문 처리가 취약해 "OO 하지 마라"가 역효과를 낼 수 있다.
#       반드시 긍정형 규칙으로 변환할 것.

constraints:
  - id: C001
    origin: "(예시) 준비 2주 소요로 폐기"
    rule: "준비 기간은 3일 이내로 제안한다."
  - id: C002
    origin: "(예시) 매장 조리 불가로 폐기"
    rule: "조리는 협력사 매장 또는 이동식 장비에서 완료하고, 바틀링은 반입·조합만 담당한다."
  - id: C003
    origin: "(예시) 원가율 과다로 폐기"
    rule: "예상 원가는 판매가의 40%를 넘지 않는다."
