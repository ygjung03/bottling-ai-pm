name: collect-realtime

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (5~15분 지연될 수 있음)
  workflow_dispatch:          # 수동 실행

# 이전 실행이 아직 도는 중에 다음 크론이 걸리면 대기시킨다.
# 한 실행이 25분을 쓰므로 30분 크론과 겹칠 수 있다.
# 취소하지 않는 이유는, 취소하면 그 25분치 수집이 통째로 날아가기 때문이다.
concurrency:
  group: collect-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # 한 번 실행될 때 5분 간격으로 6회 수집한다.
      #
      # 크론이 30분 간격으로 걸리지 않기 때문이다. 실제 이력을 보면
      # 2~10시간 간격이고, 하루 반 동안 아예 걸리지 않은 적도 있다.
      # 실행 1회당 1건만 넣으면 그만큼 시계열에 구멍이 생기는데,
      # 이 API 는 과거 조회가 불가능해 놓친 시점은 영구히 복구할 수 없다.
      #
      # collected_at 에 API 가 준 PPLTN_TIME 을 넣고
      # UNIQUE (collected_at, spot) 이 걸려 있으므로,
      # 같은 값이 오면 upsert 가 덮어쓰기만 한다. 중복은 쌓이지 않는다.
      #
      # 한 회가 실패해도 나머지를 계속 돌린다. 중간에 죽으면
      # 그 실행의 나머지 수집분까지 함께 잃기 때문이다.
      - name: Collect
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SUPABASE_URL:  ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:  ${{ secrets.SUPABASE_KEY }}
        run: |
          ROUNDS=6
          GAP=290
          fail=0
          for i in $(seq 1 $ROUNDS); do
            echo "───── $i/$ROUNDS ($(TZ=Asia/Seoul date '+%H:%M:%S' ) KST) ─────"
            if ! python -m collectors.realtime; then
              fail=$((fail + 1))
              echo "[WARN] $i 회차 실패 (누적 $fail)"
            fi
            if [ "$i" -lt "$ROUNDS" ]; then
              sleep $GAP
            fi
          done
          echo "───── 종료: $ROUNDS 회 중 $fail 회 실패 ─────"
          # 전부 실패하면 키 만료나 API 장애일 수 있으므로 실패로 표시한다.
          # 일부만 실패한 것은 일시적 오류로 보고 통과시킨다.
          if [ "$fail" -eq "$ROUNDS" ]; then
            exit 1
          fi
